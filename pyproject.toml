[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-agent-marketing-data-scientist"
version = "0.1.0"
description = "Evidence-backed multi-agent marketing analytics platform"
requires-python = ">=3.9"
dependencies = [
    "duckdb>=1.4,<2",
    "fastapi>=0.116,<1",
    "pydantic>=2.8,<3",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<10",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
